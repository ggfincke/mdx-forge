# templates/architecture-check.yml
# starting-point PR workflow -> copy into .github/workflows/ of a target repo
# uses pull_request (not pull_request_target) & comments on same-repo PRs only

name: Architecture Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # cartographer is not yet published -> build it from the mdx-forge repo
      - name: Install cartographer
        run: |
          git clone --depth 1 https://github.com/ggfincke/mdx-forge /tmp/mdx-forge
          cd /tmp/mdx-forge/plugins/cartographer
          npm ci || npm install
          npm run build

      - name: Baseline graph from base ref
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          node /tmp/mdx-forge/plugins/cartographer/dist/cli/index.js build .
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Diff against baseline
        id: drift
        continue-on-error: true
        run: |
          node /tmp/mdx-forge/plugins/cartographer/dist/cli/index.js diff . \
            | tee .cartographer/pr-comment.txt

      - name: Upload architecture artifacts
        uses: actions/upload-artifact@v4
        with:
          name: architecture-artifacts
          path: .cartographer/

      - name: Comment on same-repo PRs
        if: ${{ steps.drift.outcome == 'failure' && github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Architecture drift'
            echo '```'
            cat .cartographer/pr-comment.txt
            echo '```'
          } > body.md
          gh pr comment "$PR_NUMBER" --body-file body.md
