<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>cartographer</title>
    <link rel="stylesheet" href="/app.css" />
    <style>
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .cartographer-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 10;
        display: flex;
        gap: 0.75rem;
        align-items: baseline;
        padding: 0.5rem 1rem;
        background: rgba(255, 255, 255, 0.92);
        border-bottom: 1px solid #d0d7de;
        font-size: 0.85rem;
      }
      .cartographer-filter {
        margin-left: auto;
        width: 16rem;
        padding: 0.2rem 0.5rem;
        font-size: 0.8rem;
        font-family: ui-monospace, monospace;
        border: 1px solid #d0d7de;
        border-radius: 6px;
      }
      .cartographer-match-count {
        color: #57606a;
        font-variant-numeric: tabular-nums;
      }
      .cartographer-status {
        padding: 2rem;
        font-size: 0.9rem;
        color: #57606a;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/app.js"></script>
  </body>
</html>
