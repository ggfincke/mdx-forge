name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run typecheck:dev
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # root vitest imports plugins/render source; its deps resolve from plugins/render/node_modules
      - run: npm ci
        working-directory: plugins/render
      - run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm run check:esm-specifiers
      - run: npm pack --dry-run

  plugin-compat:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:plugin-compat

  consumer-matrix:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: 'npm'
      - run: npm install --global npm@11.17.0
      - run: npm ci
      # plugin legs run in the dedicated plugin-compat job
      - run: npm run check:consumers -- --skip-plugin-compat
